<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tickets">
<meta name="theme-color" content="#170d15">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ticket Tracker</title>
<style>
  :root {
    --bg: #170d15;
    --surface: #241520;
    --line: #3a2333;
    --text: #fff4fa;
    --muted: #b48fa6;
    --accent: #ff6fb5;
    --accent-2: #e8459a;
    --ok: #ffd95a;
    --on-ok: #3d2600;
    --tab-h: 64px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  .screen {
    position: fixed; inset: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    padding: env(safe-area-inset-top) 16px 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: none;
  }
  .screen.active { display: block; }

  /* ---------- Tap screen ---------- */
  #tap.active { display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  #btn {
    --size: min(78vw, 58vh, 420px);
    width: var(--size); height: var(--size); border-radius: 50%;
    border: 0; padding: 0; color: #fff; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffd6ec 0%, #ff9ccf 30%, var(--accent) 62%, var(--accent-2) 100%);
    box-shadow: 0 20px 60px -10px rgba(255, 111, 181, .55), inset 0 -10px 30px rgba(140, 0, 70, .22), inset 0 10px 30px rgba(255, 255, 255, .25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; isolation: isolate;
    touch-action: manipulation;
    transition: transform .08s ease-out, box-shadow .08s ease-out;
  }
  #btn.paused { filter: saturate(.55) brightness(.9); }
  #btn.paused #timer { opacity: .7; }
  #btn.pressed { transform: scale(.95); box-shadow: 0 8px 30px -10px rgba(255, 111, 181, .6), inset 0 -6px 20px rgba(140, 0, 70, .25), inset 0 8px 24px rgba(255, 255, 255, .25); }
  /* Shimmer: a soft highlight sweeping across every few seconds. */
  #btn::after {
    content: ''; position: absolute; inset: -20%; z-index: -1; pointer-events: none;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .35) 50%, transparent 60%);
    transform: translateX(-100%);
    animation: shimmer 3.5s ease-in-out infinite;
  }
  @keyframes shimmer { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  #count { font-size: calc(var(--size) * .36); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-shadow: 0 2px 12px rgba(160, 0, 80, .35); }
  #timer { margin-top: calc(var(--size) * .04); font-size: calc(var(--size) * .1); font-weight: 500; opacity: .9; font-variant-numeric: tabular-nums; text-shadow: 0 1px 8px rgba(160, 0, 80, .35); }

  /* ---------- Tap effects: a gum bubble that pops into sparkles ---------- */
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  #fx i { position: absolute; display: block; }
  .pop {
    width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .85) 0 9%, rgba(255, 194, 226, .55) 22%, rgba(255, 111, 181, .3) 70%, rgba(255, 111, 181, .65) 100%);
    animation: pop .32s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: scale(.15); opacity: .95; }
    60% { transform: scale(1); opacity: .95; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .spark {
    width: var(--z); height: var(--z); margin: calc(var(--z) / -2) 0 0 calc(var(--z) / -2);
    background: var(--c);
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    animation: spark var(--d) cubic-bezier(.15, .7, .3, 1) var(--delay) both;
  }
  .spark.dot { clip-path: none; border-radius: 50%; width: calc(var(--z) / 2); height: calc(var(--z) / 2); }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(.2) rotate(0); opacity: 0; }
    10% { opacity: 1; }
    45% { transform: translate(calc(var(--dx) * .75), calc(var(--dy) * .75)) scale(1.15) rotate(calc(var(--r) * .5)); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.3) rotate(var(--r)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #btn::after { display: none; }
  }
  #label { margin-top: 18px; color: var(--muted); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  #undo {
    margin-top: 14px; height: 36px; padding: 0 18px; border-radius: 18px;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); font: inherit; font-size: 15px;
    visibility: hidden; opacity: 0; transition: opacity .2s;
  }
  #undo.show { visibility: visible; opacity: 1; }

  /* ---------- Lists ---------- */
  h1 { font-size: 28px; margin: 20px 0 12px; letter-spacing: -.01em; }
  .group { margin-bottom: 20px; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--surface); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .row:first-child { border-top: 0; }
  .num { color: var(--muted); width: 36px; }
  .time { color: var(--muted); flex: 1; }
  .dur { font-weight: 600; }
  .dur.live { color: var(--accent); }
  .dur.none { color: var(--muted); font-weight: 400; }
  .day-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .day-row:first-child { border-top: 0; }
  .day-name { font-weight: 600; }
  .day-count { font-weight: 700; font-size: 20px; text-align: right; grid-row: span 2; align-self: center; }
  .day-meta { color: var(--muted); font-size: 13px; }
  .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .summary { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat { flex: 1; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .tools { display: flex; gap: 10px; margin: 8px 0 28px; }
  .tools button, .tools label {
    flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); font: inherit; font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .note { color: var(--muted); font-size: 12px; text-align: center; margin: -16px 0 28px; }
  #reset {
    display: block; width: 100%; height: 44px; margin: 0 0 28px; border-radius: 12px;
    border: 1px solid var(--line); background: none; color: var(--accent); font: inherit; font-size: 15px;
  }
  #reset.armed { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .cat {
    display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 10px; vertical-align: 1px;
    background: rgba(255, 111, 181, .15); color: var(--accent); font-size: 12px;
  }
  .row[data-ts] { cursor: pointer; }

  /* ---------- Category sheet ---------- */
  #sheet {
    position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35);
    opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
  }
  #sheet.open { opacity: 1; visibility: visible; }
  .sheet-card {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
    transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .3, 1);
  }
  #sheet.open .sheet-card { transform: none; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #sheet-title { font-size: 17px; font-weight: 600; }
  #skip { background: none; border: 0; color: var(--muted); font: inherit; font-size: 16px; padding: 8px 0 8px 16px; }
  #chips { display: flex; flex-wrap: wrap; gap: 10px; max-height: 40vh; overflow-y: auto; }
  .chip {
    height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px;
  }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; animation: pick .25s ease-out; }
  .chip.selected::before { content: '✓\00a0'; }
  @keyframes pick { 50% { transform: scale(1.08); } }
  .chip.add { border: 1px dashed var(--accent); background: none; color: var(--accent); }
  #new-cat { display: flex; gap: 10px; margin-top: 12px; }
  #new-cat[hidden] { display: none; }
  #new-name {
    flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text;
  }
  #new-name:focus { outline: none; border-color: var(--accent); }
  #save {
    display: block; width: 100%; height: 54px; margin-top: 18px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 600;
    transition: background .2s;
  }
  #save:disabled { background: var(--line); color: var(--muted); }
  #save.done { background: var(--ok); color: var(--on-ok); }
  #toast {
    position: fixed; left: 50%; z-index: 30; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
    max-width: calc(100vw - 32px); padding: 12px 20px; border-radius: 24px;
    background: var(--ok); color: var(--on-ok); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .5); pointer-events: none;
    opacity: 0; transform: translate(-50%, 16px); transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .3, 1);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #new-cat button { height: 46px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 600; }

  /* ---------- Tab bar ---------- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: rgba(23,13,21,.92); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  nav button {
    flex: 1; background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  nav button svg { width: 24px; height: 24px; }
  nav button.active { color: var(--accent); }
</style>
</head>
<body>

<section id="tap" class="screen active">
  <button id="btn" aria-label="Start ticket">
    <span id="count">0</span>
    <span id="timer">0:00</span>
  </button>
  <div id="label">tickets today</div>
  <button id="undo">Undo last tap</button>
</section>

<section id="tickets" class="screen">
  <h1>Time per ticket</h1>
  <div id="tickets-list"></div>
</section>

<section id="days" class="screen">
  <h1>Tickets per day</h1>
  <div id="days-list"></div>
</section>

<div id="fx"></div>

<div id="sheet">
  <div class="sheet-card" role="dialog" aria-labelledby="sheet-title">
    <div class="sheet-head"><span id="sheet-title">Category</span><button id="skip">Skip</button></div>
    <div id="chips"></div>
    <form id="new-cat" hidden>
      <input id="new-name" placeholder="New category" maxlength="30" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
      <button>Add</button>
    </form>
    <button id="save" disabled>Pick a category</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<nav>
  <button data-tab="tap" class="active">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>Tap
  </button>
  <button data-tab="tickets">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Tickets
  </button>
  <button data-tab="days">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Days
  </button>
</nav>

<script>
(() => {
  const KEY = 'ticket-tracker.taps.v1';
  const ENDS_KEY = 'ticket-tracker.ends.v1';
  const CATS_KEY = 'ticket-tracker.cats.v1';
  const PICKER_DELAY_MS = 350;
  const UNDO_MS = 5000;

  // ---------- Storage ----------
  // Data is two sorted arrays of timestamps (ms): taps start tickets, ends pause (stop)
  // the running ticket. Plus a map of tap timestamp -> category name. Everything else is derived.
  function load(key = KEY) {
    let raw;
    try { raw = localStorage.getItem(key); } catch { return []; }
    if (!raw) return [];
    try {
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) throw new Error('bad shape');
      return arr.filter(Number.isFinite).sort((a, b) => a - b);
    } catch {
      // Never silently overwrite data we couldn't read: stash it first.
      try { localStorage.setItem(key + '.corrupt.' + Date.now(), raw); } catch {}
      return [];
    }
  }
  function loadCats() {
    let raw;
    try { raw = localStorage.getItem(CATS_KEY); } catch { return {}; }
    if (!raw) return {};
    try {
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('bad shape');
      return obj;
    } catch {
      try { localStorage.setItem(CATS_KEY + '.corrupt.' + Date.now(), raw); } catch {}
      return {};
    }
  }
  function save() {
    saveLocal();
    push();
  }
  function saveLocal() {
    try {
      localStorage.setItem(KEY, JSON.stringify(taps));
      localStorage.setItem(ENDS_KEY, JSON.stringify(ends));
      localStorage.setItem(CATS_KEY, JSON.stringify(cats));
    } catch {
      if (!cloud) toast('Couldn’t save on this device. Export a backup from the Days tab.');
    }
  }
  let taps = load(), ends = load(ENDS_KEY), cats = loadCats();
  const reload = () => { taps = load(); ends = load(ENDS_KEY); cats = loadCats(); };

  // Ask the browser not to evict our storage (no-op where unsupported).
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // Keep in sync if the app is open in two places on the same device.
  addEventListener('storage', e => { if ([KEY, ENDS_KEY, CATS_KEY].includes(e.key)) { reload(); render(); } });

  // ---------- Helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const todayKey = () => dayKey(Date.now());
  const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  const clock = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function timerText(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
  }
  function durText(ms) {
    const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    if (h) return `${h}h ${pad(m)}m`;
    if (m) return `${m}m ${pad(s % 60)}s`;
    return `${s}s`;
  }
  function dayLabel(key) {
    const t = todayKey();
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (key === t) return 'Today';
    if (key === dayKey(y)) return 'Yesterday';
    const [Y, M, D] = key.split('-').map(Number);
    return new Date(Y, M - 1, D).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  }

  // ---------- Cloud sync ----------
  // Only when running as a claude.ai artifact: each month is one document in the viewer's
  // private db space, so the data survives and follows them across devices. localStorage
  // stays as the instant local copy.
  const monthKey = ms => dayKey(ms).slice(0, 7);
  const nums = a => (Array.isArray(a) ? a : []).filter(Number.isFinite).sort((x, y) => x - y);
  const sortedCats = o => Object.fromEntries(Object.entries(o || {}).filter(([, c]) => typeof c === 'string').sort(([a], [b]) => a - b));
  let cloud = null;                    // { col, ready } once the viewer's space is reachable
  const synced = {}, busy = {};        // month -> JSON the cloud has; month -> write in flight
  const dirty = new Set();             // months changed again while a write was in flight

  function monthData(m) {
    const inM = t => monthKey(t) === m;
    const c = {};
    for (const [ts, name] of Object.entries(cats)) if (inM(Number(ts))) c[ts] = name;
    return { taps: taps.filter(inM), ends: ends.filter(inM), cats: sortedCats(c) };
  }
  function replaceMonth(m, d) {
    const out = t => monthKey(t) !== m;
    taps = taps.filter(out).concat(d.taps).sort((a, b) => a - b);
    ends = ends.filter(out).concat(d.ends).sort((a, b) => a - b);
    for (const ts of Object.keys(cats)) if (monthKey(Number(ts)) === m) delete cats[ts];
    Object.assign(cats, d.cats);
  }

  function push() {
    if (!cloud?.ready) return;
    const months = new Set([...taps, ...ends].map(monthKey).concat(Object.keys(synced)));
    for (const m of months) if (JSON.stringify(monthData(m)) !== synced[m]) write(m);
  }
  async function write(m) {
    if (busy[m]) { dirty.add(m); return; }
    busy[m] = true;
    try {
      do {
        dirty.delete(m);
        const data = monthData(m), json = JSON.stringify(data);
        if (json === synced[m]) continue;
        const ref = cloud.col.doc('m' + m);
        if (data.taps.length || data.ends.length) await ref.set(data); else await ref.delete();
        synced[m] = json;
      } while (dirty.has(m));
    } catch (e) {
      syncError(e);
    } finally {
      busy[m] = false;
    }
  }

  // The first answer is merged with what's on this device (nothing gets lost when a phone
  // starts using the cloud); after that the cloud copy of each month wins, unless this
  // device has a newer change to that month on its way up.
  function applyRemote(snap) {
    const first = !cloud.ready;
    const remote = {};
    for (const d of snap.docs) if (/^m\d{4}-\d{2}$/.test(d.id)) remote[d.id.slice(1)] = d.data();
    let changed = false;
    for (const m of new Set([...Object.keys(remote), ...Object.keys(synced)])) {
      if (busy[m] || dirty.has(m)) continue;
      const r = remote[m] || {};
      const d = { taps: nums(r.taps), ends: nums(r.ends), cats: sortedCats(r.cats) };
      synced[m] = JSON.stringify(d);
      if (first) {
        const mine = monthData(m);
        d.taps = nums([...new Set([...d.taps, ...mine.taps])]);
        d.ends = nums([...new Set([...d.ends, ...mine.ends])]);
        d.cats = sortedCats({ ...d.cats, ...mine.cats });
      }
      if (JSON.stringify(d) === JSON.stringify(monthData(m))) continue;
      replaceMonth(m, d);
      changed = true;
    }
    if (changed) { saveLocal(); render(); }
  }

  function syncError(e) {
    toast(e?.code === 'quota_exceeded'
      ? 'Cloud storage is full. Taps are still saved on this device.'
      : 'Couldn’t sync. Taps are still saved on this device.');
  }

  async function startSync() {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = db && user ? await user.id() : null;
    if (!uid) return;
    cloud = { col: db.collection('data/users/' + uid), ready: false };
    cloud.col.onSnapshot(snap => {
      if (snap.metadata.fromCache) return;
      applyRemote(snap);
      if (!cloud.ready) { cloud.ready = true; push(); }
    }, syncError);
  }

  // A ticket lasts from its tap until it's paused (or the next tap, in data from before
  // pausing existed), same day only. Returns Infinity when nothing has stopped it yet.
  function stopOf(start, nextTap = Infinity) {
    const end = ends.find(e => e > start && dayKey(e) === dayKey(start));
    return Math.min(nextTap, end ?? Infinity);
  }
  function running() {
    const last = taps[taps.length - 1];
    return last != null && dayKey(last) === todayKey() && stopOf(last) === Infinity;
  }

  // Group taps by day. The unstopped last ticket of today is still running; on a past
  // day that wasn't ended it's open-ended.
  function byDay() {
    const days = new Map();
    for (const t of taps) {
      const k = dayKey(t);
      if (!days.has(k)) days.set(k, []);
      days.get(k).push(t);
    }
    return [...days.entries()].reverse().map(([key, list]) => {
      const tickets = list.map((start, i) => {
        const stop = stopOf(start, list[i + 1]);
        return { n: i + 1, start, dur: stop < Infinity ? stop - start : null };
      });
      const done = tickets.filter(t => t.dur != null);
      const avg = done.length ? done.reduce((a, t) => a + t.dur, 0) / done.length : null;
      const last = tickets[tickets.length - 1];
      return { key, tickets, avg, ended: last.dur != null ? last.start + last.dur : null };
    });
  }

  // ---------- Tap screen ----------
  const $ = id => document.getElementById(id);
  const btn = $('btn'), countEl = $('count'), timerEl = $('timer'), labelEl = $('label'), undoBtn = $('undo');
  let undoTimeout, undoKind, undoTarget;

  function renderTap() {
    const t = todayKey();
    let n = 0;
    for (let i = taps.length - 1; i >= 0 && dayKey(taps[i]) === t; i--) n++;
    countEl.textContent = n;
    const last = taps[taps.length - 1];
    const live = running();
    // While paused the timer holds the last ticket's time until the next tap starts a new one.
    timerEl.textContent = live ? timerText(Date.now() - last) : n ? timerText(stopOf(last) - last) : '0:00';
    labelEl.textContent = n && !live ? `paused ${clock(stopOf(last))} · tap for next` : 'tickets today';
    btn.classList.toggle('paused', n > 0 && !live);
    btn.setAttribute('aria-label', live ? 'Pause ticket' : 'Start ticket');
  }

  function offerUndo(kind) {
    const list = kind === 'end' ? ends : taps;
    undoKind = kind; undoTarget = list[list.length - 1];
    undoBtn.textContent = kind === 'end' ? 'Undo pause' : 'Undo new ticket';
    undoBtn.classList.add('show');
    clearTimeout(undoTimeout);
    undoTimeout = setTimeout(() => undoBtn.classList.remove('show'), UNDO_MS);
  }

  // A gum bubble inflates at the tap point, pops, and throws out glitter.
  const fx = $('fx');
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  const SPARK_COLORS = ['#fff', '#ffe3f2', '#ff9ccf', '#ffd76a', '#d9c8ff'];
  function burst(x, y) {
    if (calm.matches) return;
    const size = btn.offsetWidth;
    const add = (cls, vars) => {
      const el = document.createElement('i');
      el.className = cls;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      for (const k in vars) el.style.setProperty(k, vars[k]);
      el.addEventListener('animationend', () => el.remove());
      fx.appendChild(el);
    };
    add('pop', { '--s': size * .35 + 'px' });
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, dist = size * (.2 + Math.random() * .35);
      add(Math.random() < .35 ? 'spark dot' : 'spark', {
        '--dx': Math.cos(a) * dist + 'px', '--dy': Math.sin(a) * dist + 'px',
        '--z': 8 + Math.random() * 12 + 'px', '--c': SPARK_COLORS[i % SPARK_COLORS.length],
        '--r': Math.random() * 360 - 180 + 'deg', '--d': 550 + Math.random() * 400 + 'ms', '--delay': '170ms',
      });
    }
  }

  // Play/pause: a tap starts the next ticket, the following tap pauses it. Time spent
  // paused doesn't count toward any ticket.
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    btn.classList.add('pressed');
    keepAwake();
    if (running()) {
      ends.push(Date.now());
      clearTimeout(pickerTimeout);
      save();
      renderTap();
      offerUndo('end');
      if (navigator.vibrate) navigator.vibrate(20);
      return;
    }
    taps.push(Date.now());
    save();
    renderTap();
    burst(e.clientX, e.clientY);
    offerUndo('tap');
    // Let the pop play before the picker slides up.
    const ts = taps[taps.length - 1], n = countEl.textContent;
    clearTimeout(pickerTimeout);
    pickerTimeout = setTimeout(() => openSheet(ts, `Ticket #${n}`), PICKER_DELAY_MS);
  });
  const release = () => btn.classList.remove('pressed');
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);

  undoBtn.addEventListener('click', () => {
    const list = undoKind === 'end' ? ends : taps;
    if (list.length && list[list.length - 1] === undoTarget) {
      list.pop();
      if (undoKind === 'tap') delete cats[undoTarget];
      save();
      renderTap();
    }
    undoBtn.classList.remove('show');
  });

  // ---------- Category picker ----------
  // Tap a category to select it (or add one with "+ New"), then Save to confirm.
  const sheet = $('sheet'), chipsEl = $('chips'), newForm = $('new-cat'), newName = $('new-name'), saveBtn = $('save');
  const SAVED_MS = 600;
  let sheetFor = null, sheetTitle = '', selected = null, added = [], pickerTimeout, toastTimeout;

  // Most used first, so the usual picks stay put at the top.
  function categories() {
    const counts = {};
    for (const c of Object.values(cats)) counts[c] = (counts[c] || 0) + 1;
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  }

  function renderChips() {
    chipsEl.innerHTML = [...categories(), ...added].map(c =>
      `<button class="chip${c === selected ? ' selected' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`
    ).join('') + '<button class="chip add" id="add-cat">+ New</button>';
    saveBtn.disabled = !selected;
    saveBtn.textContent = selected ? `Save · ${selected}` : 'Pick a category';
  }

  function openSheet(ts, title) {
    sheetFor = ts; sheetTitle = title;
    selected = cats[ts] || null; added = [];
    $('sheet-title').textContent = title;
    newForm.hidden = true;
    newName.value = '';
    saveBtn.classList.remove('done');
    renderChips();
    sheet.classList.add('open');
  }

  function select(cat) {
    selected = cat;
    renderChips();
  }

  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => el.classList.remove('show'), 2200);
  }

  saveBtn.addEventListener('click', () => {
    if (!selected || sheetFor == null || saveBtn.classList.contains('done')) return;
    if (taps.includes(sheetFor)) { cats[sheetFor] = selected; save(); render(); }
    saveBtn.classList.add('done');
    saveBtn.textContent = '✓ Saved';
    if (navigator.vibrate) navigator.vibrate(30);
    const msg = `✓ ${sheetTitle} saved as ${selected}`;
    setTimeout(() => { closeSheet(); toast(msg); }, SAVED_MS);
  });

  function closeSheet() {
    sheetFor = null;
    newName.blur();
    sheet.classList.remove('open');
    // The undo window ran out behind the sheet; give it a fresh one.
    if (undoKind === 'tap' && taps[taps.length - 1] === undoTarget && tab === 'tap') offerUndo('tap');
  }

  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'add-cat') { b.hidden = true; newForm.hidden = false; newName.focus(); }
    else select(b.dataset.cat);
  });
  newForm.addEventListener('submit', e => {
    e.preventDefault();
    const name = newName.value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    // Reuse an existing category that only differs by case.
    const existing = [...categories(), ...added].find(c => c.toLowerCase() === name.toLowerCase());
    if (!existing) added.push(name);
    newName.value = '';
    newName.blur();
    newForm.hidden = true;
    select(existing || name);
  });
  $('skip').addEventListener('click', () => closeSheet());
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

  // Keep the screen on while the app is visible (iOS 16.4+). Silently ignored elsewhere.
  let wakeLock = null;
  async function keepAwake() {
    if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { reload(); render(); keepAwake(); }
  });

  // ---------- Tickets screen ----------
  function renderTickets() {
    const days = byDay();
    const today = todayKey();
    if (!days.length) { $('tickets-list').innerHTML = '<div class="empty">No tickets yet.</div>'; return; }
    $('tickets-list').innerHTML = days.map(d => {
      const rows = d.tickets.slice().reverse().map(t => {
        let dur;
        if (t.dur != null) dur = `<span class="dur">${durText(t.dur)}</span>`;
        else if (d.key === today) dur = `<span class="dur live" data-live="${t.start}">${durText(Date.now() - t.start)}</span>`;
        else dur = `<span class="dur none">—</span>`;
        const cat = cats[t.start] ? `<span class="cat">${esc(cats[t.start])}</span>` : '';
        return `<div class="row" data-ts="${t.start}" data-n="${t.n}"><span class="num">#${t.n}</span><span class="time">${clock(t.start)}${cat}</span>${dur}</div>`;
      }).join('');
      return `<div class="group">
        <div class="group-head"><span>${dayLabel(d.key)}</span><span>${d.tickets.length} · avg ${d.avg != null ? durText(d.avg) : '—'}</span></div>
        <div class="card">${rows}</div>
      </div>`;
    }).join('');
  }

  $('tickets-list').addEventListener('click', e => {
    const row = e.target.closest('.row[data-ts]');
    if (row) openSheet(Number(row.dataset.ts), `Ticket #${row.dataset.n}`);
  });

  // ---------- Days screen ----------
  function renderDays() {
    const days = byDay();
    if (!days.length) { $('days-list').innerHTML = '<div class="empty">No tickets yet.</div>' + toolsHtml(); return; }
    const max = Math.max(...days.map(d => d.tickets.length));
    const total = taps.length;
    const avgPerDay = total / days.length;
    const rows = days.map(d => `
      <div class="day-row">
        <span class="day-name">${dayLabel(d.key)}</span>
        <span class="day-count">${d.tickets.length}</span>
        <span class="day-meta">avg ${d.avg != null ? durText(d.avg) : '—'} · ${clock(d.tickets[0].start)}–${clock(d.ended ?? d.tickets[d.tickets.length - 1].start)}</span>
        <div class="bar"><i style="width:${(d.tickets.length / max) * 100}%"></i></div>
      </div>`).join('');
    $('days-list').innerHTML = `
      <div class="summary">
        <div class="stat"><b>${total}</b><span>All time</span></div>
        <div class="stat"><b>${avgPerDay.toFixed(1)}</b><span>Avg / day</span></div>
        <div class="stat"><b>${days.length}</b><span>Days</span></div>
      </div>
      <div class="card">${rows}</div>
      <div style="height:20px"></div>
      ${toolsHtml()}`;
  }

  function toolsHtml() {
    return `<div class="tools">
        <button id="export">Export backup</button>
        <label>Import backup<input id="import" type="file" accept="application/json,.json" hidden></label>
      </div>
      <div class="note">${cloud ? 'Synced to your claude.ai account.' : 'Data is saved on this phone only.'} Export now and then for safekeeping.</div>
      ${taps.length ? '<button id="reset">Reset all data</button>' : ''}`;
  }

  // Two taps to reset: the first arms the button for a few seconds.
  const RESET_ARM_MS = 4000;
  let resetArmed = 0;
  document.addEventListener('click', e => {
    if (e.target.id !== 'reset') return;
    const n = taps.length;
    if (Date.now() - resetArmed > RESET_ARM_MS) {
      resetArmed = Date.now();
      e.target.textContent = `Tap again to delete all ${n} tap${n === 1 ? '' : 's'}`;
      e.target.classList.add('armed');
      setTimeout(() => {
        const b = $('reset');
        if (b && Date.now() - resetArmed >= RESET_ARM_MS) { b.textContent = 'Reset all data'; b.classList.remove('armed'); }
      }, RESET_ARM_MS);
      return;
    }
    resetArmed = 0;
    taps = []; ends = []; cats = {}; save();
    toast('All data deleted');
    clearTimeout(undoTimeout); undoBtn.classList.remove('show');
    render();
  });

  document.addEventListener('click', async e => {
    if (e.target.id !== 'export') return;
    const json = JSON.stringify({ app: 'ticket-tracker', version: 1, exported: new Date().toISOString(), taps, ends, cats }, null, 1);
    const file = new File([json], `tickets-${todayKey()}.json`, { type: 'application/json' });
    const downloads = window.claude?.use ? await claude.use('downloads') : null;
    if (downloads) {
      try { await downloads.save({ filename: file.name, data: json }); }
      catch (err) { if (err?.code !== 'declined') toast('Couldn’t export the backup. Try again in a moment.'); }
    } else if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch {}
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  });

  document.addEventListener('change', async e => {
    if (e.target.id !== 'import' || !e.target.files[0]) return;
    try {
      const data = JSON.parse(await e.target.files[0].text());
      const incoming = (Array.isArray(data) ? data : data.taps).filter(Number.isFinite);
      if (!incoming.length) throw new Error();
      // Merge instead of replace, so importing can never lose taps.
      const merged = [...new Set([...taps, ...incoming])].sort((a, b) => a - b);
      const added = merged.length - taps.length;
      const incomingEnds = (Array.isArray(data.ends) ? data.ends : []).filter(Number.isFinite);
      ends = [...new Set([...ends, ...incomingEnds])].sort((a, b) => a - b);
      // Keep categories already set here; only fill in ones we don't have.
      for (const [ts, c] of Object.entries(data.cats || {})) if (typeof c === 'string' && !(ts in cats)) cats[ts] = c;
      taps = merged; save(); render();
      toast(`Imported ${added} new tap${added === 1 ? '' : 's'}`);
    } catch {
      toast('That file isn’t a ticket tracker backup.');
    }
    e.target.value = '';
  });

  // ---------- Tabs & render loop ----------
  let tab = 'tap';
  document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === tab));
    render();
  }));

  function render() {
    if (tab === 'tap') renderTap();
    else if (tab === 'tickets') renderTickets();
    else renderDays();
  }

  let lastDay = todayKey();
  setInterval(() => {
    // Re-render everything when the date rolls over so "today" resets to 0.
    if (todayKey() !== lastDay) { lastDay = todayKey(); render(); return; }
    if (tab === 'tap') renderTap();
    else if (tab === 'tickets') document.querySelectorAll('[data-live]').forEach(el => {
      el.textContent = durText(Date.now() - Number(el.dataset.live));
    });
  }, 250);

  render();

  startSync().catch(() => {});

  if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
